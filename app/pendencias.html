<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendências</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232b6cb0'/><path d='M9 16l5 5 9-10' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--bd:#dfe3ea;--ac:#2b6cb0;--acs:#e7f0fa;
--ok:#2f9e5b;--okb:#dcf3e5;--an:#c98a00;--anb:#fff2cc;--rv:#d64545;--rvb:#fde2e2;--na:#9aa1ad;--nab:#eceef2}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--tx:#e6e8ec;--mut:#9aa1ad;--bd:#2e343e;--ac:#5b9be0;--acs:#1d2a3a;
--okb:#173a26;--anb:#3a2f10;--rvb:#3d1c1c;--nab:#2a2e35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:650}
.save{font-size:12px;color:var(--mut);margin-left:auto;display:flex;gap:8px;align-items:center}
.save b{font-weight:600}
.save.warn b{color:var(--rv)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.sm{padding:2px 7px;font-size:12px}
button.ghost{border-color:transparent;background:transparent}
.entry{margin-top:10px;background:var(--acs);border-radius:12px;padding:10px 12px 6px}
.elab{display:block;font-size:13px;margin-bottom:6px}
.erow{display:flex;gap:8px}
.qwrap{position:relative;flex:1}
button.big{font-size:14px;padding:8px 14px;white-space:nowrap;border-radius:9px}
.sub{font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.03em}
.sub.red{color:var(--rv)}.sub.amb{color:var(--an)}
details.card>summary{cursor:pointer;font-weight:600;list-style:none}
details.card>summary::before{content:'▸ ';color:var(--mut)}
details.card[open]>summary::before{content:'▾ '}
details.card[open]>summary{margin-bottom:6px}
.tk .mini{display:flex;gap:3px;opacity:.5}.tk:hover .mini{opacity:1}
#q{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--ac);border-radius:9px;background:var(--card);color:var(--tx);outline:none}
#qprev{font-size:12px;color:var(--mut);min-height:18px;margin-top:4px}
#qprev .k{display:inline-block;background:var(--acs);color:var(--ac);border-radius:5px;padding:0 6px;margin-right:4px}
#ac{position:absolute;left:0;right:0;top:46px;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px #0003;max-height:260px;overflow:auto;display:none;z-index:30}
#ac{max-height:min(470px,70vh)}
#ac .opt{padding:6px 10px;cursor:pointer;display:flex;gap:10px;align-items:center}
#ac .opt.sel,#ac .opt:hover{background:var(--acs)}
#ac .opt .lb{flex:1}
#ac .opt .mini{display:flex;gap:3px;opacity:.55}
#ac .opt:hover .mini,#ac .opt.sel .mini{opacity:1}
#ac .opt .cell{flex-shrink:0;color:var(--mut)}
#ac .opt .cell.ok,#ac .opt .cell.and,#ac .opt .cell.rev,#ac .opt .cell.na{color:inherit}
#ac .opt .cell.ok{color:var(--ok)}#ac .opt .cell.and{color:var(--an)}#ac .opt .cell.rev{color:var(--rv)}
#ac .achead{padding:8px 10px;border-bottom:1px solid var(--bd);font-size:13px;position:sticky;top:0;background:var(--card);z-index:1}
#ac code{font-weight:600;min-width:96px}
nav{display:flex;gap:4px;margin-top:8px}
nav button{border:none;background:none;padding:6px 12px;border-radius:7px;color:var(--mut)}
nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--rv);color:#fff;font-size:11px;text-align:center;margin-left:4px}
.badge.z{background:var(--nab);color:var(--mut)}
main{padding:14px 16px 80px;max-width:1300px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.card h3 .n{color:var(--mut);font-weight:400}
.card.red{border-left:4px solid var(--rv)}.card.amb{border-left:4px solid var(--an)}.card.blu{border-left:4px solid var(--ac)}.card.gry{border-left:4px solid var(--na)}
.it{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:none}
.it .t{flex:1;min-width:0}
.it .acts{display:flex;gap:4px;flex-shrink:0}
.chip{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:5px;background:var(--nab);color:var(--mut);margin-right:4px;white-space:nowrap;cursor:pointer}
.chip.code{background:var(--acs);color:var(--ac);font-weight:600}
.chip.late{background:var(--rvb);color:var(--rv)}
.chip.today{background:var(--anb);color:var(--an)}
.chip.hi{background:var(--rv);color:#fff}
.mut{color:var(--mut)}
.empty{color:var(--mut);padding:30px;text-align:center}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input,.filters select{font:inherit;padding:5px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--card);color:var(--tx)}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
th.c,td.c{text-align:center;width:52px}
td.s{cursor:pointer;user-select:none}
.cell{display:inline-block;width:40px;height:22px;line-height:22px;border-radius:5px;font-size:11px;font-weight:600;border:1px dashed var(--bd);color:transparent}
.cell.ok{background:var(--okb);color:var(--ok);border:1px solid transparent}
.cell.and{background:var(--anb);color:var(--an);border:1px solid transparent}
.cell.rev{background:var(--rvb);color:var(--rv);border:1px solid transparent}
.cell.na{background:var(--nab);color:var(--na);border:1px solid transparent}
td.s:hover .cell{outline:2px solid var(--ac)}
.lhead{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.lhead h2{font-size:15px;margin:0}
.bar{height:6px;background:var(--nab);border-radius:3px;overflow:hidden;width:120px}
.bar i{display:block;height:100%;background:var(--ok)}
.desc{cursor:pointer}
.desc:hover{color:var(--ac)}
.code{font-family:Consolas,monospace;font-size:12.5px;white-space:nowrap}
.legend{font-size:12px;color:var(--mut);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend .cell{width:28px;height:16px;line-height:16px;font-size:10px}
.tk{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--bd)}
.tk input[type=checkbox]{margin-top:3px;width:16px;height:16px}
.tk .t{flex:1}
.tk.done .tx{text-decoration:line-through;color:var(--mut)}
.tx[contenteditable]:focus{outline:2px solid var(--ac);border-radius:4px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);padding:18px;width:min(620px,94vw)}
dialog::backdrop{background:#0006}
dialog label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
dialog input,dialog select,dialog textarea{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx)}
dialog textarea{min-height:110px}
.row{display:flex;gap:10px}.row>*{flex:1}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222a;backdrop-filter:blur(6px);background:#1d2330;color:#fff;padding:9px 14px;border-radius:9px;display:none;gap:12px;align-items:center;z-index:50;box-shadow:0 6px 20px #0004}
#toast button{background:none;color:#8cc4ff;border:none;font-weight:600}
#banner{display:none;background:var(--anb);color:var(--tx);padding:8px 16px;border-bottom:1px solid var(--bd);font-size:13px}
#banner button{margin-left:8px}
.help{font-size:13px}
.help code{background:var(--nab);padding:1px 5px;border-radius:4px}
.help td,.help th{font-size:13px}
kbd{border:1px solid var(--bd);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
@media (max-width:700px){.erow{flex-direction:column}th.c,td.c{width:34px}.cell{width:28px}.hide-s{display:none}}
</style>
</head>

    </div>

  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseYmd=s=>{if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c).getTime()};
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
function fmtDue(s){if(!s)return'';const t=parseYmd(s),d0=today0(),diff=Math.round((t-d0)/DAY);
  if(diff===0)return'hoje';if(diff===1)return'amanhã';if(diff===-1)return'ontem';
  const d=new Date(t);const base=DOW[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
  return diff<0?base+' ('+(-diff)+'d atrás)':base}
function ago(t){const d=Math.floor((Date.now()-t)/DAY);return d<=0?'hoje':d===1?'ontem':d+' dias'}
const P=id=>D.products.find(p=>p.id===id);
const L=id=>D.lines.find(l=>l.id===id);

/* ---------- armazenamento ---------- */
function lsGet(){try{const s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(D))}catch(e){}}
const idb={open(){return new Promise((r,j)=>{const q=indexedDB.open('pendencias',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})},
 async get(k){const db=await this.open();return new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})},
 async set(k,v){const db=await this.open();return new Promise(r=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r()})}};
const FS_OK='showDirectoryPicker' in window;
const SERVER=/^https?:$/.test(location.protocol); // rodando pelo Pendencias.exe (pendrive)
let serverInfo={};
async function putServer(){try{const r=await fetch('/api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});saveState=r.ok?'file':'lost'}catch(e){saveState='lost'}renderSave()}
async function getServer(){const r=await fetch('/api/data',{cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('http '+r.status);return r.json()}

async function readDirFile(dir){try{const fh=await dir.getFileHandle('pendencias.json');const f=await fh.getFile();return JSON.parse(await f.text())}catch(e){return null}}
async function writeDir(){
  if(!fileDir)return;
  try{
    const fh=await fileDir.getFileHandle('pendencias.json',{create:true});
    const w=await fh.createWritable();await w.write(JSON.stringify(D,null,1));await w.close();
    // backup diário (guarda um arquivo por dia na subpasta backup)
    const bk=await fileDir.getDirectoryHandle('backup',{create:true});
    const name='pendencias-'+ymd(Date.now())+'.json';
    let exists=true;try{await bk.getFileHandle(name)}catch(e){exists=false}
    if(!exists){const b=await bk.getFileHandle(name,{create:true});const bw=await b.createWritable();await bw.write(JSON.stringify(D));await bw.close()}
    saveState='file';
  }catch(e){saveState='lost';fileDir=null}
  renderSave();
}
let saveT;
function save(){D.savedAt=Date.now();lsSet();clearTimeout(saveT);saveT=setTimeout(SERVER?putServer:writeDir,400);renderSave();refreshBadges()}
async function pickDir(){
  if(!FS_OK){alert('Este navegador não permite gravar em pasta. Use o Edge ou o Chrome.');return}
  try{
    const dir=await showDirectoryPicker({id:'pendencias',mode:'readwrite'});
    const fromFile=await readDirFile(dir);
    fileDir=dir;await idb.set('dir',dir);
    if(fromFile&&fromFile.savedAt&&fromFile.savedAt>(D.savedAt||0)&&confirm('Já existe um pendencias.json mais recente nessa pasta. Carregar ele?')){D=fromFile;migrate()}
    await writeDir();$('#banner').style.display='none';render();toast('Pasta vinculada: os dados agora são salvos em pendencias.json');
  }catch(e){}
}
async function reconnect(){
  const dir=await idb.get('dir');if(!dir)return;
  if(await dir.requestPermission({mode:'readwrite'})==='granted'){
    fileDir=dir;const f=await readDirFile(dir);
    if(f&&f.savedAt>(D.savedAt||0)){D=f;migrate()}
    await writeDir();$('#banner').style.display='none';render();
  }
}
async function boot(){
  if(SERVER){
    try{const d=await getServer();if(d){D=d;migrate();saveState='file'}else{D=structuredClone(SEED);migrate();await putServer()}}
    catch(e){D=lsGet()||structuredClone(SEED);migrate();saveState='lost'}
    try{serverInfo=await (await fetch('/api/info',{cache:'no-store'})).json()}catch(e){}
    render();renderSave();setInterval(render,30*60e3);
    document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible')return;try{const d=await getServer();if(d&&(d.savedAt||0)>(D.savedAt||0)){D=d;migrate();render()}saveState='file'}catch(e){saveState='lost'}renderSave()});
    return;
  }
  D=lsGet()||structuredClone(SEED)||{v:1,settings:{},lines:[],products:[],tasks:[],prefixes:[],log:[]};
  migrate();
  if(FS_OK){
    const dir=await idb.get('dir').catch(()=>null);
    if(dir){
      const perm=await dir.queryPermission({mode:'readwrite'});
      if(perm==='granted'){fileDir=dir;const f=await readDirFile(dir);if(f&&f.savedAt>(D.savedAt||0)){D=f;migrate()}saveState='file';lsSet()}
      else{saveState='lost';showBanner('O app precisa da sua permissão para continuar salvando na pasta de dados.','Reconectar pasta',reconnect)}
    }else showBanner('Os dados estão só no navegador. Escolha uma pasta (ex.: Desktop\\Claude) para salvar em arquivo e ter backup diário.','Escolher pasta',pickDir);
  }
  
  render();renderSave();checkNotify();setInterval(()=>{render();checkNotify()},30*60e3);
}
function migrate(){D.settings=Object.assign({stallDays:7,idleTaskDays:14,notifyTimes:['09:00','13:30','16:30']},D.settings||{});D.log=D.log||[];D.prefixes=D.prefixes||[];
  D.products.forEach(p=>{p.st=p.st||{};STAGES.forEach(([k])=>p.st[k]=p.st[k]||'')});}
function showBanner(msg,btn,fn){const b=$('#banner');b.innerHTML=esc(msg)+' <button class="pri sm">'+esc(btn)+'</button> <button class="sm ghost">depois</button>';b.style.display='block';
  const [x,y]=b.querySelectorAll('button');x.onclick=fn;y.onclick=()=>b.style.display='none'}
function renderSave(){const s=$('#save');
  if(SERVER){s.className='save'+(saveState==='file'?'':' warn');s.innerHTML=(saveState==='file'?'<b>✓ salvo no pendrive</b>':'<b>⚠ o Pendencias.exe foi fechado — abra de novo para salvar</b>')+' <button class="sm" id="bHelp" title="Ajuda e configurações">? Ajuda</button>';$('#bHelp').onclick=()=>{view='ajuda';render()};return}
  const st=saveState==='file'?'<b>✓ salvo</b>':saveState==='lost'?'<b>⚠ pasta desconectada</b> (salvando só no navegador)':'<b>⚠ só no navegador</b>';
  s.className='save'+(saveState==='file'?'':' warn');
  s.innerHTML=st+(fileDir?'':' <button class="sm" id="bDir">Escolher pasta</button>')+' <button class="sm" id="bHelp" title="Ajuda e configurações">? Ajuda</button>';
  const bd=$('#bDir');if(bd)bd.onclick=pickDir;$('#bHelp').onclick=()=>{view='ajuda';render()};}
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='pendencias-'+ymd(Date.now())+'.json';a.click()}
function importJson(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{const d=JSON.parse(await i.files[0].text());if(!d.products)throw 0;snap('Importar');D=d;migrate();save();render();toast('Dados importados')}catch(e){alert('Arquivo inválido')}};i.click()}

/* ---------- desfazer ---------- */
function snap(label){undoStack.push({label,data:JSON.stringify(D)});if(undoStack.length>40)undoStack.shift()}
function undo(){const u=undoStack.pop();if(!u){toast('Nada para desfazer',false);return}D=JSON.parse(u.data);save();render();toast('Desfeito: '+u.label,false)}

/* ---------- avisos ("não deixe esquecer") ---------- */
function pendingStages(p){return STAGES.filter(([k])=>p.st[k]===''||p.st[k]==='and'||p.st[k]==='rev')}
function isDone(p){return pendingStages(p).length===0}
function alerts(){
  const t0=today0(),soon=t0+3*DAY,now=Date.now(),S=D.settings;
  const open=D.tasks.filter(t=>!t.done&&!(t.snooze&&parseYmd(t.snooze)>t0));
  const late=open.filter(t=>t.due&&parseYmd(t.due)<t0).sort((a,b)=>a.due.localeCompare(b.due));
  const today=open.filter(t=>t.due&&parseYmd(t.due)===t0);
  const next=open.filter(t=>t.due&&parseYmd(t.due)>t0&&parseYmd(t.due)<=soon).sort((a,b)=>a.due.localeCompare(b.due));
  const idle=open.filter(t=>!t.due&&now-(t.touched||t.created)>S.idleTaskDays*DAY);
  const snoozed=p=>p.snooze&&parseYmd(p.snooze)>t0;
  const rev=D.products.filter(p=>!snoozed(p)&&STAGES.some(([k])=>p.st[k]==='rev'));
  const stalled=D.products.filter(p=>!snoozed(p)&&!isDone(p)&&STAGES.some(([k])=>p.st[k]==='ok'||p.st[k]==='and')&&now-p.touched>S.stallDays*DAY).sort((a,b)=>(a.seq||99)-(b.seq||99)||a.touched-b.touched);
  // conflitos de cadastro
  const conflicts=[];const byCode={};
  D.products.forEach(p=>{const c=(p.code||'').trim();
    if(!c||!/^[A-Z]{2,3}\d{3,4}\.\d{3}(\/\d{3})?$/i.test(c))conflicts.push({p,msg:c?'Código fora do padrão ("'+c+'")':'Produto sem código'});
    else (byCode[c.toUpperCase()]=byCode[c.toUpperCase()]||[]).push(p);
    if(!p.ignoreGap){let seenEmpty=null;for(const k of FLOW){if(p.st[k]===''&&!seenEmpty)seenEmpty=k;else if(seenEmpty&&p.st[k]==='ok'){conflicts.push({p,msg:STAGES.find(s=>s[0]===k)[1]+' está OK mas '+STAGES.find(s=>s[0]===seenEmpty)[1]+' não',gap:1});break}}}
  });
  Object.entries(byCode).forEach(([c,ps])=>{if(ps.length>1)ps.forEach(p=>conflicts.push({p,msg:'Código repetido em '+ps.length+' produtos ('+ps.map(x=>x.desc.slice(0,28)).join(' / ')+')'}))});
  // foco: menor sequência ainda com pendências
  const pend=D.products.filter(p=>p.seq&&!isDone(p));const minSeq=pend.length?Math.min(...pend.map(p=>p.seq)):0;
  const focus=pend.filter(p=>p.seq===minSeq);
  return{late,today,next,idle,rev,stalled,conflicts,focus,minSeq};
}
function alertCount(a=alerts()){return a.late.length+a.today.length}
function refreshBadges(){const a=alerts();const n=alertCount(a);document.title=(n?'('+n+') ':'')+'Pendências';renderNav(a)}
function checkNotify(){if(SERVER)return;
  const a=alerts(),n=alertCount(a);if(!n||!('Notification' in window)||Notification.permission!=='granted')return;
  const key=ymd(Date.now())+':'+n;if(D.settings.lastNotify===key)return;D.settings.lastNotify=key;lsSet();
  try{new Notification('Pendências',{body:(a.late.length?a.late.length+' atrasada(s). ':'')+(a.today.length?a.today.length+' para hoje.':'')})}catch(e){}
}

/* ---------- linha de comando rápida ---------- */
const STAGE_W={'3d':'3d','2d':'2d',vol:'vol',volume:'vol',volumes:'vol',cad:'cad',cadastro:'cad',man:'man',manual:'man',manuais:'man',custo:'custo',ean:'ean',tudo:'*',todas:'*',todos:'*'};
const STAT_W={ok:'ok',feito:'ok',pronto:'ok',fiz:'ok',rev:'rev',rever:'rev',revisar:'rev',and:'and',andamento:'and',fazendo:'and',na:'na','n/a':'na','-':'na',limpar:'',apagar:'',zerar:''};
const DOWW={dom:0,domingo:0,seg:1,segunda:1,ter:2,terca:2,qua:3,quarta:3,qui:4,quinta:4,sex:5,sexta:5,sab:6,sabado:6};
const CODE_RE=/^[A-Z]{2,3}\d{3,4}(\.\d{3}(\/\d{3})?)?$/i;
function findProducts(tok){const u=tok.toUpperCase();
  let m=D.products.filter(p=>(p.code||'').toUpperCase()===u);if(m.length)return m;
  return D.products.filter(p=>(p.code||'').toUpperCase().split('.')[0]===u)}
function findLine(tag){const n=norm(tag);if(!n)return null;return D.lines.find(l=>norm(l.name).split(/[\s()]+/).some(w=>w.startsWith(n)))||D.lines.find(l=>norm(l.name).includes(n))}
function parse(str){
  const toks=str.trim().split(/\s+/).filter(Boolean);const r={prods:[],stages:[],status:undefined,due:null,prio:0,line:null,words:[],tags:[],badCodes:[]};
  const t0=today0();const textToks=[];
  for(const tk of toks){const n=norm(tk);let m;
    if(CODE_RE.test(tk)){const f=findProducts(tk);if(f.length){r.prods.push(...f);continue}r.badCodes.push(tk);textToks.push(tk);continue}
    if(n in STAGE_W){r.stages.push(STAGE_W[n]);textToks.push(tk);continue}
    if(n in STAT_W&&r.status===undefined){r.status=STAT_W[n];textToks.push(tk);continue}
    if(n==='hoje'){r.due=ymd(t0);continue}
    if(n==='amanha'){r.due=ymd(t0+DAY);continue}
    if(n==='ontem'){r.due=ymd(t0-DAY);continue}
    if(n in DOWW){const d=new Date(t0);const add=(DOWW[n]-d.getDay()+7)%7||7;r.due=ymd(t0+add*DAY);continue}
    if(m=n.match(/^\+(\d+)(d|s)?$/)){r.due=ymd(t0+(+m[1])*(m[2]==='s'?7:1)*DAY);continue}
    if(m=n.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/)){let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;let t=new Date(y,m[2]-1,+m[1]).getTime();if(!m[3]&&t<t0-30*DAY)t=new Date(y+1,m[2]-1,+m[1]).getTime();r.due=ymd(t);continue}
    if(/^!+$/.test(tk)||n==='!alta'||n==='!urgente'){r.prio=1;continue}
    if(tk.startsWith('#')&&tk.length>1){const l=findLine(tk.slice(1));if(l){r.line=l;continue}r.tags.push(tk.slice(1));continue}
    r.words.push(tk);textToks.push(tk);
  }
  r.isStatus=r.prods.length>0&&r.stages.length>0&&r.status!==undefined&&r.words.length===0&&!r.due&&!r.prio&&!r.badCodes.length;
  r.text=textToks.join(' ');
  return r;
}
function preview(){
  const v=$('#q').value;if(!v.trim()){$('#qprev').innerHTML='<span class="mut">Enter cria a pendência · <kbd>Tab</kbd> completa código · <kbd>Ctrl</kbd>+<kbd>Z</kbd> desfaz · digite <b>?</b> para ver todos os atalhos</span>';return}
  if(v.trim()==='?'){$('#qprev').innerHTML='Enter → abrir a ajuda';return}
  const r=parse(v);let h='';
  if(r.isStatus){h='<span class="k">Atualizar etapa</span> '+r.prods.map(p=>'<b>'+esc(p.code)+'</b>').join(', ')+' → '+r.stages.map(s=>s==='*'?'todas':STAGES.find(x=>x[0]===s)[1]).join(', ')+' = <b>'+(ST_LABEL[r.status]||'vazio')+'</b>'}
  else if(r.prods.length&&!r.text&&!r.due&&!r.prio){h='<span class="k">Escolha</span> ↑↓ e Enter (ou clique) · ou continue digitando para criar uma pendência para '+r.prods.map(p=>esc(p.code)).join(', ')}
  else if(r.text||r.prods.length){h='<span class="k">Nova pendência</span> '+esc(r.text||'(sem texto)');
    if(r.prods.length)h+=' · '+r.prods.map(p=>'<span class="chip code">'+esc(p.code)+'</span>').join('');
    const ln=r.line||(r.prods[0]&&L(r.prods[0].line));if(ln)h+=' <span class="chip">'+esc(ln.name)+'</span>';
    if(r.due)h+=' <span class="chip today">'+fmtDue(r.due)+'</span>';if(r.prio)h+=' <span class="chip hi">alta</span>';
    if(r.badCodes.length)h+=' <span class="chip late">código não cadastrado: '+esc(r.badCodes.join(', '))+'</span>';}
  $('#qprev').innerHTML=h;
}
function submit(){
  const v=$('#q').value.trim();if(!v)return;
  if(v==='?'){view='ajuda';$('#q').value='';render();preview();return}
  const r=parse(v);
  if(r.isStatus){
    snap(v);const ks=r.stages.includes('*')?STAGES.map(s=>s[0]):r.stages;
    r.prods.forEach(p=>{ks.forEach(k=>p.st[k]=r.status);p.touched=Date.now()});
    log(v);save();render();toast(r.prods.length+' produto(s) atualizado(s)');
  }else if(r.prods.length&&!r.text&&!r.due&&!r.prio){
    filt.q=r.prods[0].code.split('.')[0];filt.pend=false;view='matriz';render();
  }else{
    snap('nova pendência');const txt=(r.text||'Revisar')+(r.tags.length?' #'+r.tags.join(' #'):'');
    const base={text:txt,due:r.due,prio:r.prio,done:false,created:Date.now()};
    if(r.prods.length)r.prods.forEach(p=>D.tasks.push({...base,id:uid('T'),pid:p.id,line:p.line}));
    else D.tasks.push({...base,id:uid('T'),pid:null,line:r.line?r.line.id:null});
    log('Nova: '+v);save();render();toast('Pendência criada'+(r.prods.length>1?' para '+r.prods.length+' produtos':''));
  }
  $('#q').value='';preview();hideAc();
}

let acItems=[],acSel=0,acProds=[];
function curToken(){const q=$('#q'),v=q.value,pos=q.selectionStart;const s=v.lastIndexOf(' ',pos-1)+1;return{s,e:pos,tok:v.slice(s,pos)}}
function nextFree(pref){const u=String(pref||'').toUpperCase().replace(/\..*$/,'');const mm=u.match(/^([A-Z]{2,3})(\d*)$/);if(!mm)return'';
  const L_=mm[1],d=mm[2];const nums=D.products.map(p=>(p.code||'').toUpperCase().split('.')[0]).filter(b=>b.startsWith(L_+d)&&/^\d+$/.test(b.slice(L_.length))).map(b=>b.slice(L_.length));
  let len=nums.length?Math.max(...nums.map(x=>x.length)):4;let n;
  if(nums.length)n=Math.max(...nums.map(Number))+1;
  else if(d)n=parseInt((d+'0000').slice(0,Math.max(len,d.length)))+(d.length>=len?0:1);
  else{const pf=D.prefixes.find(([a])=>String(a).toUpperCase().startsWith(L_));n=pf?(+pf[1])*100+1:1001}
  return L_+String(n).padStart(len,'0')}
function familyOf(base){const u=base.toUpperCase();for(const n of [4,3,2]){const f=D.products.filter(p=>(p.code||'').toUpperCase().startsWith(u.slice(0,n)));if(f.length)return f}return[]}
function mostCommon(arr){const c={};arr.forEach(x=>{if(x!==undefined&&x!==null&&x!=='')c[x]=(c[x]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}
function suffixesFor(base){const fam=familyOf(base);const s=mostCommon(fam.map(p=>(p.code.split('.')[1]||'')).filter(Boolean));const all=mostCommon(D.products.map(p=>(p.code||'').split('.')[1]).filter(Boolean));return[...new Set([...s,...all])].slice(0,6)}

}
function showNew(r,v){
  const code=r.badCodes[0].toUpperCase();const desc=r.words.filter(w=>w.toUpperCase()!==code).join(' ');
  acProds=[];acItems=[{kind:'new',code,desc,html:'<span class="cell ok">＋</span><span class="lb">Criar produto <b class="code">'+esc(code)+'</b>'+(desc?' — '+esc(desc.toUpperCase()):' (Enter abre a ficha para pôr a descrição)')+'</span>'}];
  if(desc)acItems.push({kind:'plain',html:'<span class="cell">📝</span><span class="lb">Não — criar só uma pendência com esse texto</span>'});
  const fam=familyOf(code.split('.')[0]);
  acSel=0;acRender('<div class="achead">Código <b class="code">'+esc(code)+'</b> ainda não existe'+(fam.length?' · família parecida: '+[...new Set(fam.slice(0,6).map(p=>p.code))].map(esc).join(', '):'')+'</div>');
}
function showAc(){
  const v=$('#q').value;const{tok}=curToken();acItems=[];acProds=[];
  if(tok.startsWith('#')){const n=norm(tok.slice(1));acItems=D.lines.filter(l=>norm(l.name).includes(n)).map(l=>({kind:'ins',ins:'#'+norm(l.name).split(/[\s()]+/).filter(Boolean)[l.name.startsWith('SALAS')||l.name.startsWith('COZINHA')||l.name.startsWith('ROUPEIROS')?1:0],html:'<code>linha</code><span>'+esc(l.name)+'</span>'}))}
  else{
    let sug=[];
    if(tok.length>=2&&/[a-z]/i.test(tok)){const u=tok.toUpperCase(),n=norm(tok),alone=v.trim()===tok;const seen=new Set();
      D.products.filter(p=>(p.code||'').toUpperCase().startsWith(u)||(alone&&tok.length>=3&&norm(p.desc).includes(n))).forEach(p=>{const ins=(p.code||'').split('.')[0];if(!ins||seen.has(ins))return;seen.add(ins);sug.push({kind:'ins',ins,html:'<code>'+esc(p.code)+'</code><span>'+esc(p.desc)+'</span>'})});sug=sug.slice(0,12)}
    const exact=sug.length===1&&sug[0].ins.toUpperCase()===tok.toUpperCase();
    if(/^[a-z]{2,3}\d{0,3}$/i.test(tok)&&v.trim()===tok){const nf=nextFree(tok);if(nf&&!exact)sug.push({kind:'newfree',code:nf,html:'<code style="color:var(--ok)">＋ '+esc(nf)+'</code><span>Criar <b>novo</b> produto com o próximo código livre</span>'})}
    if(norm(v)==='novo'||v.trim()==='+'){acItems=[{kind:'newfree',code:'',html:'<span class="cell ok">＋</span><span class="lb">Criar produto novo</span>'}]}
    else if(sug.length&&!exact)acItems=sug;
    else{const r=parse(v);if(r.prods.length&&!r.text&&!r.due&&!r.prio&&!r.line&&!r.tags.length){showActions([...new Set(r.prods)]);return}
      if(r.badCodes.length&&!r.prods.length){showNew(r,v);return}}
  }
  if(!acItems.length){hideAc();return}
  acSel=0;acRender('');
}
function stOf(ps,k){return ps.length===1?ps[0].st[k]:(ps.every(p=>p.st[k]==='ok')?'ok':ps.every(p=>p.st[k]===ps[0].st[k])?ps[0].st[k]:'')}
function showActions(ps){
  acProds=ps;acItems=[];
  STAGES.forEach(([k,l])=>{const s=stOf(ps,k);
    acItems.push({kind:'stage',k,html:'<span class="cell '+s+'">'+(ST_LABEL[s]||'·')+'</span><span class="lb">'+(s==='ok'?'Desmarcar <b>'+l+'</b>':'<b>'+l+'</b> → OK')+'</span><span class="mini">'+['and','rev','na'].map(x=>'<button class="sm" data-x="'+x+'" data-k="'+k+'" title="'+({and:'em andamento',rev:'rever',na:'não se aplica'})[x]+'">'+ST_LABEL[x]+'</button>').join('')+'</span>'})});
  if(ps.some(p=>STAGES.some(([k])=>p.st[k]===''||p.st[k]==='and')))acItems.push({kind:'all',html:'<span class="cell ok">OK</span><span class="lb">Marcar <b>todas</b> as etapas OK</span>'});
  D.tasks.filter(t=>!t.done&&ps.some(p=>p.id===t.pid)).forEach(t=>acItems.push({kind:'done',id:t.id,html:'<span class="cell">☐</span><span class="lb">Concluir: '+esc(t.text)+(t.due?' <span class="chip">'+fmtDue(t.due)+'</span>':'')+'</span>'}));
  acItems.push({kind:'task',html:'<span class="cell">📝</span><span class="lb">Nova pendência — é só continuar digitando e dar Enter</span>'});
  if(ps.length===1)acItems.push({kind:'open',html:'<span class="cell">✎</span><span class="lb">Abrir ficha do produto (editar, observações, histórico)</span>'});
  acItems.push({kind:'list',html:'<span class="cell">☰</span><span class="lb">Ver na lista de produtos</span>'});
  const head='<div class="achead">'+ps.map(p=>'<b class="code">'+esc(p.code)+'</b> '+esc(p.desc)+' <span class="mut">· '+esc(L(p.line)?.name||'')+'</span>').join('<br>')+(ps.length>1&&new Set(ps.map(p=>p.code)).size<ps.length?'<div style="color:var(--rv)">⚠ código repetido: as ações valem para os '+ps.length+' produtos</div>':'')+'</div>';
  const first=acItems.findIndex(a=>a.kind==='stage'&&stOf(ps,a.k)!=='ok'&&stOf(ps,a.k)!=='na');
  acSel=acSel<acItems.length&&acSel>0?acSel:(first<0?0:first);acRender(head);
}
function acRender(head){
  const ac=$('#ac');ac.innerHTML=head+acItems.map((a,i)=>'<div data-i="'+i+'" class="opt'+(i===acSel?' sel':'')+'">'+a.html+'</div>').join('');ac.style.display='block';
  ac.querySelectorAll('.opt').forEach(d=>d.onmousedown=e=>{e.preventDefault();if(e.target.closest('[data-x]'))return;acSel=+d.dataset.i;acRun(acSel)});
  ac.querySelectorAll('[data-x]').forEach(b=>b.onmousedown=e=>{e.preventDefault();e.stopPropagation();acSel=acItems.findIndex(a=>a.k===b.dataset.k);setStage(b.dataset.k,b.dataset.x)});
  const sel=ac.querySelector('.sel');if(sel)sel.scrollIntoView({block:'nearest'});
}
function setStage(k,val){const ps=acProds;snap(ps.map(p=>p.code).join(' ')+' '+k);
  const cur=stOf(ps,k);const nv=val!==undefined?(cur===val?'':val):(cur==='ok'?'':'ok');
  ps.forEach(p=>{p.st[k]=nv;p.touched=Date.now()});log(ps.map(p=>p.code).join(' ')+' '+k+' → '+(ST_LABEL[nv]||'vazio'));
  save();render();showActions(ps);toast(STAGES.find(s=>s[0]===k)[1]+' → '+(ST_LABEL[nv]||'vazio'))}
function acRun(i){const a=acItems[i];if(!a)return;const q=$('#q'),ps=acProds;
  if(a.kind==='ins'){const{s,e}=curToken();q.value=q.value.slice(0,s)+a.ins+' '+q.value.slice(e);q.selectionStart=q.selectionEnd=s+a.ins.length+1;preview();acSel=0;showAc();return}
  if(a.kind==='stage'){setStage(a.k);return}
  if(a.kind==='all'){snap('tudo OK');ps.forEach(p=>{STAGES.forEach(([k])=>{if(p.st[k]!=='na')p.st[k]='ok'});p.touched=Date.now()});log(ps.map(p=>p.code).join(' ')+' tudo OK');save();render();showActions(ps);toast('Todas as etapas OK');return}
  if(a.kind==='done'){const t=D.tasks.find(t=>t.id===a.id);snap('concluir');t.done=true;t.doneAt=Date.now();log('Concluída: '+t.text);save();render();acSel=0;showActions(ps);toast('Pendência concluída');return}
  if(a.kind==='task'){hideAc();if(!q.value.endsWith(' '))q.value+=' ';q.focus();q.selectionStart=q.selectionEnd=q.value.length;$('#qprev').innerHTML='<span class="k">Nova pendência</span> digite o que precisa fazer (pode pôr prazo: sexta, 15/11, +3 · e ! para alta)';return}
  if(a.kind==='open'){hideAc();q.value='';preview();openProduct(ps[0].id);return}
  if(a.kind==='new'||a.kind==='newfree'){hideAc();q.value='';preview();newProductDialog({code:a.code,desc:a.desc||''});return}
  if(a.kind==='plain'){hideAc();submit();return}
  if(a.kind==='list'){hideAc();filt.q=ps[0].code.split('.')[0];filt.pend=false;filt.line='';view='matriz';q.value='';preview();render();return}
}
function hideAc(){$('#ac').style.display='none';acItems=[];acProds=[]}

});

function doneTask(id){act(()=>{const t=D.tasks.find(t=>t.id===id);t.done=!t.done;t.doneAt=t.done?Date.now():null;if(t.done)log('Concluída: '+t.text)},'Pendência concluída')}

function cycleStage(pid,k,alt){const p=P(pid);const cur=p.st[k];

  const m=$('#main');
  m.innerHTML='<div class="card"><h3>Próximo código livre</h3><div class="filters"><input id="cp" placeholder="Prefixo, ex.: ES15  ou  DM08" style="width:240px"></div><div id="cr" class="mut">Digite o começo do código para ver os usados e o próximo livre.</div></div>'+
   '<div class="card"><h3>Padronização de códigos</h3><table class="help"><tr><th>Família</th><th>Faixa</th></tr>'+D.prefixes.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td class="code">'+esc(String(a).slice(0,2).toUpperCase())+esc(b)+'XX</td></tr>').join('')+'</table></div>';
  $('#cp').oninput=e=>{const u=e.target.value.trim().toUpperCase();if(u.length<2){$('#cr').textContent='';return}
    const used=D.products.map(p=>p.code).filter(c=>c&&c.toUpperCase().startsWith(u)).sort();
    const sug=nextFree(u);
    $('#cr').innerHTML=(sug?'Próximo livre: <b class="code" style="font-size:15px">'+sug+'</b> <button class="sm pri" id="cnew">＋ Criar produto</button><br>':'')+'Usados ('+used.length+'): '+(used.map(c=>'<span class="chip code">'+esc(c)+'</span>').join(' ')||'nenhum');const b=$('#cnew');if(b)b.onclick=()=>newProductDialog({code:sug})}
}
function renderAjuda(){
  $('#main').innerHTML='<div class="card help"><h3>O campo azul entende</h3><table>'+
  [['DM0800 vol ok','marca a etapa VOL do DM0800 como OK (aceita 3d, 2d, vol, cad, man, custo, ean, tudo)'],
   ['DM0800 DM0830 cad ok','várias de uma vez'],
   ['EV3100 tudo rever','marca todas as etapas para revisão'],
   ['EV3100 trocar furação da dobradiça','cria pendência ligada ao produto'],
   ['... sexta  /  amanhã  /  hoje  /  15/11  /  +3  /  +2s','prazo (dia da semana, data, em 3 dias, em 2 semanas)'],
   ['... !','prioridade alta'],
   ['#everest ajustar ranhura 6mm','pendência ligada à linha (o # completa o nome)'],
   ['EV3100','sozinho: aparece o menu do produto (marcar etapas, concluir pendências, abrir ficha)'],
   ['ES15','mostra os códigos usados e, por último, ＋ o próximo livre (ES1505) para criar'],['ES1505.088 estante 1,60 2 portas','código que não existe: oferece criar o produto com essa descrição'],['novo','cria produto novo'],['?','abre esta ajuda']].map(([a,b])=>'<tr><td><code>'+esc(a)+'</code></td><td>'+esc(b)+'</td></tr>').join('')+'</table>'+
  '<p><kbd>Tab</kbd> completa o código · <kbd>Ctrl</kbd>+<kbd>K</kbd> ou <kbd>/</kbd> volta para a barra · <kbd>Ctrl</kbd>+<kbd>Z</kbd> desfaz · <kbd>Win</kbd>+<kbd>H</kbd> dita por voz (Windows)</p></div>'+
  '<div class="card help"><h3>Como ele te avisa</h3><ul><li>Na lista de pendências: atrasadas e de hoje em destaque; em <b>Avisos do cadastro</b>: itens REVER, produtos parados, códigos repetidos/fora do padrão e etapas puladas.</li><li>O número de atrasadas + hoje aparece no título da janela.</li>'+
   (SERVER?'<li><b>Notificação do Windows</b>: o Pendencias.exe fica no relógio (perto da hora) e avisa quando abre e nos horários abaixo, se houver algo atrasado ou para hoje — mesmo com esta janela fechada.</li></ul><div class="row" style="align-items:end"><div><label class="mut">Horários dos lembretes</label><input id="nt" value="'+esc((D.settings.notifyTimes||['09:00','13:30','16:30']).join(', '))+'" style="width:200px;padding:5px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx)"></div><div><button id="bTest">Testar notificação agora</button></div></div>':'<li>Para lembrar mesmo sem abrir: coloque o atalho do app na pasta <code>shell:startup</code> (Win+R).</li></ul>')+
  '<div class="row" style="align-items:end"><div><label class="mut">Avisar produto parado após (dias)</label><input id="sd" type="number" min="1" value="'+D.settings.stallDays+'" style="width:90px;padding:5px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx)"></div><div><label class="mut">Avisar pendência sem prazo após (dias)</label><input id="si" type="number" min="1" value="'+D.settings.idleTaskDays+'" style="width:90px;padding:5px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx)"></div>'+(SERVER?'':'<div><button id="bNot">Ativar notificação do Windows</button></div>')+'</div></div>'+
  '<div class="card help"><h3>Seus dados</h3>'+(SERVER?'<p>Ficam no pendrive, em <code>'+esc(serverInfo.dataFile||'dados\\pendencias.json')+'</code>, com uma cópia por dia em <code>dados\\backup\\</code>. Nada vai para a internet.</p>':'<p>Ficam no arquivo <code>pendencias.json</code> na pasta escolhida, com uma cópia por dia em <code>backup\\</code>. Nada vai para a internet. Use Edge ou Chrome.</p><button id="hDir">'+(fileDir?'Trocar pasta':'Escolher pasta')+'</button> ')+'<button id="hExp">Baixar backup</button> <button id="hImp">Importar backup / dados antigos</button></div>'+
  '<div class="card help"><h3>Padronização de códigos</h3><table>'+D.prefixes.map(([a,b])=>'<tr><td>'+esc(a)+'</td><td class="code">'+esc(String(a).slice(0,2).toUpperCase())+esc(b)+'XX</td></tr>').join('')+'</table></div>'+
  '<div class="card help"><h3>Últimas ações</h3>'+D.log.slice(0,15).map(l=>'<div class="mut" style="font-size:12px">'+new Date(l.ts).toLocaleString('pt-BR')+' · '+esc(l.msg)+'</div>').join('')+'</div>';
  if($('#hDir'))$('#hDir').onclick=pickDir;$('#hExp').onclick=exportJson;$('#hImp').onclick=importJson;
  $('#sd').onchange=e=>{D.settings.stallDays=Math.max(1,+e.target.value||7);save()};
  $('#si').onchange=e=>{D.settings.idleTaskDays=Math.max(1,+e.target.value||14);save()};
  if($('#nt'))$('#nt').onchange=e=>{const v=e.target.value.split(/[,;\s]+/).map(x=>x.trim()).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,'0'));D.settings.notifyTimes=v;save();e.target.value=v.join(', ');toast('Horários salvos',false)};
  if($('#bTest'))$('#bTest').onclick=async()=>{try{await fetch('/api/notify-test',{method:'POST'});toast('Notificação enviada — veja no canto da tela',false)}catch(e){toast('O Pendencias.exe não está aberto',false)}};
  if($('#bNot'))$('#bNot').onclick=async()=>{if(!('Notification' in window))return alert('Não suportado aqui');const r=await Notification.requestPermission();toast(r==='granted'?'Notificações ativadas':'O navegador não permitiu notificações neste arquivo — os avisos continuam na aba Avisos',false);checkNotify()};
}
$('#bNewP').onclick=()=>newProductDialog({line:filt.line||undefined});
preview();boot();
</script>
